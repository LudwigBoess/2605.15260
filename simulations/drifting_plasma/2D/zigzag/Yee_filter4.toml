[simulation]
  name    = "Yee_filter4"
  engine  = "srpic"
  runtime = 5000.1

[grid]
  resolution = [256, 256]
  extent     = [[-5.0, 5.0], [-5.0, 5.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.7071067811865476

[particles]
  ppc0 = 32.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e8

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e8

[setup]
  # Drift 4-velocities for each species in all 3 directions
  #   @type: array of floats (length = nspec)
  #   @default: [ 0.0, ... ]
  drifts_in_x = [-10.0, -10.0]
  drifts_in_y = [0.0, 0.0]
  drifts_in_z = [0.0, 0.0]
  # Pair-wise species densities in units of n0
  #   @type: array of floats (length = nspec/2)
  #   @default: [ 2 / nspec, ... ]
  densities = [1.0]
  # Species temperatures in units of m0 (c^2)
  #   @type: array of floats (length = nspec)
  #   @default: [ 0.0, ... ]
  temperatures = [0.08, 0.08]

[output]
  interval_time = 100.0
  format = "BPFile"

  [output.fields]
    quantities = ["N", "B", "E", "T22"]

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

[diagnostics]
  colored_stdout = false
  log_level = "WARNING"
  blocking_timers = true

[checkpoint]
  keep = 1